services:
  google-drive-init:
    image: alpine:3.22
    volumes:
      - ./config:/config
    command:
      - sh
      - -c
      - |
        mkdir -p /config
        touch /config/tokens.json
        chown -R 1000:1000 /config
        chmod 700 /config
        chmod 600 /config/*
    restart: "no"

  google-drive-mcp:
    build: .
    container_name: google-drive-mcp
    volumes:
      - ./config:/config
    environment:
      GOOGLE_DRIVE_OAUTH_CREDENTIALS: /config/gcp-oauth.keys.json
      GOOGLE_DRIVE_MCP_TOKEN_PATH: /config/tokens.json
    command: 
      - node 
      - dist/index.js

  google-drive-auth:
    build: .
    network_mode: host
    restart: "no"
    volumes:
      - ./config:/config
    environment:
      GOOGLE_DRIVE_OAUTH_CREDENTIALS: /config/gcp-oauth.keys.json
      GOOGLE_DRIVE_MCP_TOKEN_PATH: /config/tokens.json
      GOOGLE_DRIVE_MCP_AUTH_PORT: "3000"
    command:
      - node
      - dist/index.js
      - auth
